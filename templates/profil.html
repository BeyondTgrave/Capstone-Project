{% extends "base.html" %}
{% block title %}Profile{% endblock %}
{% block content %}
<h3 class="fw-bold mb-4">Profile Saya</h3>
<div class="row">
    <div class="col-md-4 mb-4">
        <div class="card border-0 shadow-sm text-center p-4" style="border-radius: 15px;">
            <img src="https://ui-avatars.com/api/?name={{ user.nama | replace(' ', '+') }}&background=0D6EFD&color=fff&size=150" 
                 alt="Foto Profil" class="rounded-circle mx-auto mb-3" 
                 style="width: 120px; height: 120px; object-fit: cover;">
            <h4 class="fw-bold mb-1">{{ user.nama }}</h4>
            <p class="text-muted mb-3">{{ user.prodi }}</p>
            <span class="badge bg-primary rounded-pill px-3 py-2">Mahasiswa Aktif</span>
        </div>
    </div>
    <div class="col-md-8">
        <div class="card border-0 shadow-sm" style="border-radius: 15px;">
            <div class="card-body p-4">
                <h5 class="fw-bold mb-4 border-bottom pb-2">Informasi Akademik</h5>
                
                <div class="mb-3 row">
                    <label class="col-sm-4 col-form-label text-muted">Nama Lengkap</label>
                    <div class="col-sm-8">
                        <input type="text" class="form-control bg-light" value="{{ user.nama }}" readonly>
                    </div>
                </div>

                <div class="mb-3 row">
                    <label class="col-sm-4 col-form-label text-muted">NIM</label>
                    <div class="col-sm-8">
                        <input type="text" class="form-control bg-light" value="{{ user.nim }}" readonly>
                    </div>
                </div>

                <div class="mb-3 row">
                    <label class="col-sm-4 col-form-label text-muted">Program Studi</label>
                    <div class="col-sm-8">
                        <input type="text" class="form-control bg-light" value="{{ user.prodi }}" readonly>
                    </div>
                </div>

                <div class="mb-3 row">
                    <label class="col-sm-4 col-form-label text-muted">Email</label>
                    <div class="col-sm-8">
                        <input type="email" class="form-control bg-light" value="{{ user.email }}" readonly>
                    </div>
                </div>

                <div class="mb-3 row">
                    <label class="col-sm-4 col-form-label text-muted">No. Telepon</label>
                    <div class="col-sm-8">
                        <input type="text" class="form-control bg-light" value="{{ user.telepon }}" readonly>
                    </div>
                </div>

                <hr>
                <button class="btn btn-primary rounded-pill px-4"><i class="bi bi-pencil me-1"></i> Edit Profil</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
